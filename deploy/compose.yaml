name: lex-raptor
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    command: [uvicorn, defense.api:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment: &server-env
      LEX_RAPTOR_INFERENCE: api
      LEX_RAPTOR_AUTH: account
      DATABASE_URL: ${DATABASE_URL:?Set managed Supabase database URL}
      SUPABASE_URL: ${SUPABASE_URL:?Set managed Supabase URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set public Supabase anon key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set private service-role key}
      APP_ORIGIN: https://${APP_DOMAIN:?Set production domain}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      <<: *server-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "from defense import db; assert db.one(\"select 1 from defense.worker_status where last_seen>now()-interval '12 minutes' limit 1\")"]
      interval: 60s
      timeout: 10s
      retries: 3
  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set production domain}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web]
volumes:
  caddy_data:
  caddy_config:
