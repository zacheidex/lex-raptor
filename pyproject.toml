[project]
name = "lex-raptor"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "openai>=2",
  "anthropic>=0.49",
  "python-docx>=1.1",
  "pypdf>=5",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.13",
  "typer>=0.15",
  "tiktoken>=0.9",
  "defusedxml>=0.7.1",
  "python-dotenv>=1.2.4",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "reportlab>=4", "ruff>=0.11"]
evaluator = [
    "google-genai>=2.28.0",
    "markitdown[docx,xlsx]>=0.1.8",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pypandoc-binary>=1.17",
]
[project.scripts]
lex-raptor = "defense.cli:app"
defense = "defense.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["engine/defense"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local Postgres"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"] # FastAPI and Typer dependency/option declarations are intentional.
